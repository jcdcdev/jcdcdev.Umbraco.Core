name: 🏗️ Build
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: jcdcdev/jcdcdev.Umbraco.GitHub.Build@v0
        with:
          project-name: jcdcdev.Umbraco.Core
          project-path: src/jcdcdev.Umbraco.Core/jcdcdev.Umbraco.Core.csproj
          umbraco-version: 16
          dotnet-version: "9"
